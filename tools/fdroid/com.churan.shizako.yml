Repo: https://github.com/cr1437/Shizako.git

Builds:
  - versionName: zako3.15
    versionCode: 315
    commit: 41f3681db4b6e3ee2a2212e4419684cc14263fc3
    subdir: manager
    gradle:
      - yes
    prebuild:
      - sed -i 's|mirrors.cloud.tencent.com/gradle/|services.gradle.org/distributions/|'
        ../gradle/wrapper/gradle-wrapper.properties
      - sed -i -e 's|maven.aliyun.com/repository/.*"|maven.google.com"|' ../settings.gradle
      - sed -i -e '/signing.gradle/d' build.gradle
      - sdkmanager 'cmake;3.31.0'
    scanignore:
      - shell/src/main/java/rikka/shizuku/shell/ShizukuShellLoader.java
    ndk: 29.0.14206865
    gradleprops:
      - fdroid

MaintainerNotes: |
  Shizako is an Apache-2.0 fork of Shizuku (RikkaApps/Shizuku) that keeps its own app
  name, its own application id (com.churan.shizako) and its own permission names. It
  cannot be installed next to the official Shizuku because the compatibility bridge
  answers the upstream provider authority; that bridge is not part of this build.

  The variant switch is the in-repo Gradle property `-Pfdroid`, passed via `gradleprops`.
  It makes versionName carry a `-f` suffix (versionCode is unchanged), turns off the
  in-app updater and update checks, removes the one-click third-party APK installation
  and the AI explain feature, stops building and packaging the compatibility placeholder
  package (the `stub` module is not included, so no APK using the upstream application
  id is produced), declares only our own provider authority, and switches the Gradle and
  Maven repositories to the official ones. fdroidserver's build.py compares versionCode
  only, so the `-f` suffix is not repeated in `versionName` above; F-Droid's own
  AutoUpdateMode: Version writes the bare version name as well.

  The `rikka.shizuku.*` strings left in the DEX (protocol keys such as
  `moe.shizuku.privileged.api.intent.extra.BINDER`, the `moe.shizuku.server.*` AIDL
  descriptors and `ShizukuProvider.MANAGER_APPLICATION_ID`) come from the vendored
  shizuku-api sources (MIT, api/LICENSE) and are interop constants - not an application
  id, a permission or the app name. `shell/.../ShizukuShellLoader.java` is scanignored
  because the rish dex it loads is compiled from source in-tree during this build.

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: build.gradle|versionCode = (\d+)|.|versionName = "([^"]+)"
